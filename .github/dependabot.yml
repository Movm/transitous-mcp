version: 2

updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:20"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    ignore:
      # Keep production on the validated Node.js 22 LTS line. Runtime-major
      # upgrades require an explicit image build and deployment smoke test.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
